<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="OctWave 3.0 · IEEE IAS Student Branch Chapter · University of Moratuwa">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050508"/>
      <stop offset="0.55" stop-color="#0a0812"/>
      <stop offset="1" stop-color="#120a1f"/>
    </linearGradient>
    <linearGradient id="glow" x1="180" y1="80" x2="520" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="220" cy="120" r="180" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="980" cy="520" r="220" fill="#7c3aed" fill-opacity="0.12" filter="url(#soft)"/>

  <g opacity="0.12" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <path d="M0 470 C 180 390, 300 520, 480 450 C 660 380, 780 500, 960 430 C 1080 380, 1140 410, 1200 390 L1200 630 L0 630 Z" fill="#7c3aed" fill-opacity="0.08"/>
  <path d="M0 500 C 220 430, 360 560, 560 490 C 760 420, 900 540, 1200 470" stroke="url(#wave)" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <path d="M0 530 C 200 470, 340 590, 540 520 C 740 450, 880 570, 1200 500" stroke="url(#wave)" stroke-width="2" stroke-linecap="round" opacity="0.28"/>

  <text x="88" y="118" fill="#b794f6" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.28em">IEEE IAS STUDENT BRANCH CHAPTER</text>
  <text x="88" y="250" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="118" font-weight="700" letter-spacing="-0.04em">OctWave</text>
  <text x="88" y="318" fill="rgba(255,255,255,0.55)" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="600" letter-spacing="0.08em">3.0</text>

  <text x="88" y="392" fill="rgba(255,255,255,0.82)" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="500">University of Moratuwa</text>
  <text x="88" y="438" fill="rgba(255,255,255,0.55)" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400">Undergraduate AI &amp; Machine Learning Competition · Sri Lanka</text>

  <rect x="88" y="486" width="320" height="4" fill="url(#wave)" opacity="0.9"/>
  <text x="88" y="548" fill="rgba(255,255,255,0.42)" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="0.12em">WORKSHOPS · KAGGLE · LIVE FINAL</text>
</svg>
